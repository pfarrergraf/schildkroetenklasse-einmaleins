<path class="body" d="M111 136 C85 142 77 157 83 170 C101 161 115 158 129 158 Z"/><path class="body" d="M178 134 C202 138 211 151 207 164 C188 158 176 155 163 155 Z"/>
<circle class="spot" cx="121" cy="109" r="8"/><circle class="spot" cx="146" cy="102" r="6"/><circle class="spot" cx="171" cy="124" r="6"/>
