<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
<title>Roxi Rex</title><desc>A cheerful small T-Rex with tiny arms.</desc>
<style>.shadow{fill:#eadbd5;opacity:.7}.body{fill:#ea6a50}.belly{fill:#ffd9a3}.dark{fill:#b54032}.eye{fill:#fff}.pupil{fill:#173028}.tooth{fill:#fff4c1}.line{fill:none;stroke:#173028;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.leg{fill:#d95a44}.nail{fill:#fff0b7}.spot{fill:#b54032;opacity:.36}#head{transform-origin:205px 92px;animation:rexChomp 1.1s ease-in-out infinite}#tail{transform-origin:78px 145px;animation:rexTail 1.3s ease-in-out infinite}@keyframes rexChomp{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg) translateY(-3px)}}@keyframes rexTail{0%,100%{transform:rotate(0)}50%{transform:rotate(-10deg)}}</style>
