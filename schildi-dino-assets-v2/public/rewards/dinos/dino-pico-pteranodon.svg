<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
<title>Pico Pteranodon</title><desc>A friendly blue pteranodon with moving wings.</desc>
<style>.shadow{fill:#d9edf5;opacity:.6}.body{fill:#58b7e0}.wing{fill:#8bd6f5}.belly{fill:#d7f4ff}.crest{fill:#ffca52}.beak{fill:#ffd66b}.eye{fill:#fff}.pupil{fill:#173028}.line{fill:none;stroke:#173028;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.claw{fill:#fff2b2}#wingL{transform-origin:146px 117px;animation:flapL .9s ease-in-out infinite}#wingR{transform-origin:174px 118px;animation:flapR .9s ease-in-out infinite}#body{animation:picoFloat 1.8s ease-in-out infinite}@keyframes flapL{0%,100%{transform:rotate(3deg)}50%{transform:rotate(-12deg)}}@keyframes flapR{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(12deg)}}@keyframes picoFloat{0%,100%{transform:translateY(2px)}50%{transform:translateY(-8px)}}</style>
<ellipse class="shadow" cx="158" cy="213" rx="88" ry="11"/>
<g id="wingL"><path class="wing" d="M146 116 C96 71 50 66 22 96 C66 104 93 129 120 165 Z"/><path class="line" d="M62 97 C91 111 111 132 128 158"/></g>
<g id="wingR"><path class="wing" d="M174 116 C225 70 272 68 300 101 C257 106 228 132 201 166 Z"/><path class="line" d="M258 100 C230 114 209 134 194 158"/></g>
<g id="body"><ellipse class="body" cx="160" cy="132" rx="43" ry="48"/><ellipse class="belly" cx="160" cy="143" rx="26" ry="29"/><path class="body" d="M133 93 C144 66 178 57 199 79 C218 99 205 130 177 134 C149 137 122 121 133 93 Z"/><path class="crest" d="M165 74 L200 43 L190 85 Z"/><path class="beak" d="M195 99 L282 88 L203 118 Z"/><circle class="eye" cx="161" cy="95" r="10"/><circle class="eye" cx="184" cy="95" r="10"/><circle class="pupil" cx="162" cy="96" r="4"/><circle class="pupil" cx="182" cy="96" r="4"/><path class="line" d="M155 116 C166 123 183 123 195 114"/><path class="body" d="M148 178 L138 207 L158 207 Z"/><path class="body" d="M174 178 L185 207 L165 207 Z"/><ellipse class="claw" cx="146" cy="208" rx="6" ry="4"/><ellipse class="claw" cx="176" cy="208" rx="6" ry="4"/></g>
</svg>
