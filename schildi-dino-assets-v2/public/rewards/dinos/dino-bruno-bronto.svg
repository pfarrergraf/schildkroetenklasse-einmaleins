<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-labelledby="title desc">
<title>Bruno Bronto</title><desc>A friendly long-neck brontosaurus for a primary school reward collection.</desc>
<style>
  .dino-shadow{fill:#dfeee3;opacity:.75}.body{fill:#6cc477}.belly{fill:#ffe39c}.dark{fill:#2f7b46}.spot{fill:#4da85d;opacity:.5}.eye{fill:#fff}.pupil{fill:#173028}.cheek{fill:#ffb3a5;opacity:.75}.line{fill:none;stroke:#173028;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.leg{fill:#55ad62}.nail{fill:#fff0b7}
  #head{transform-origin:225px 66px;animation:brontoHead 1.8s ease-in-out infinite}#tail{transform-origin:58px 131px;animation:brontoTail 1.3s ease-in-out infinite}.blink{animation:blink 4s infinite}@keyframes brontoHead{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(5deg)}}@keyframes brontoTail{0%,100%{transform:rotate(0)}50%{transform:rotate(-8deg)}}@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
</style>
<ellipse class="dino-shadow" cx="157" cy="211" rx="105" ry="17"/>
<path id="tail" class="body" d="M78 125 C41 112 24 123 12 139 C39 143 57 148 78 160 Z"/>
<ellipse class="body" cx="142" cy="140" rx="82" ry="52"/>
<ellipse class="belly" cx="150" cy="151" rx="48" ry="30"/>
<path class="body" d="M195 116 C193 82 204 51 231 35 C246 26 269 31 280 46 C292 63 286 84 269 95 C253 106 237 104 226 93 C221 109 218 122 220 139 Z"/>
<g id="head"><ellipse class="body" cx="254" cy="65" rx="40" ry="33"/><circle class="eye blink" cx="242" cy="57" r="9"/><circle class="eye blink" cx="271" cy="59" r="9"/><circle class="pupil" cx="244" cy="58" r="4"/><circle class="pupil" cx="269" cy="60" r="4"/><circle class="cheek" cx="278" cy="74" r="7"/><path class="line" d="M244 78 C253 86 266 86 274 78"/></g>
<circle class="spot" cx="132" cy="112" r="8"/><circle class="spot" cx="160" cy="103" r="6"/><circle class="spot" cx="183" cy="126" r="7"/><circle class="spot" cx="222" cy="53" r="5"/>
<path class="leg" d="M89 158 L80 202 L107 202 L112 160 Z"/><path class="leg" d="M145 168 L139 206 L166 206 L171 166 Z"/><path class="leg" d="M190 160 L195 205 L220 205 L214 158 Z"/><path class="leg" d="M111 161 L113 200 L137 200 L134 165 Z"/>
<ellipse class="nail" cx="87" cy="203" rx="7" ry="5"/><ellipse class="nail" cx="101" cy="203" rx="7" ry="5"/><ellipse class="nail" cx="147" cy="207" rx="7" ry="5"/><ellipse class="nail" cx="161" cy="207" rx="7" ry="5"/><ellipse class="nail" cx="201" cy="206" rx="7" ry="5"/><ellipse class="nail" cx="214" cy="206" rx="7" ry="5"/>
</svg>
